---
# Source: tsdns/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: tsdns
  labels:
    app.kubernetes.io/name: tsdns
data:
  Corefile: |
    cluster.example:53 {
        errors
        health :8080
        ready :8181
        rewrite name suffix .svc.cluster.example. .svc.cluster.local. answer auto
        forward . 172.20.0.10
        cache 30
        prometheus :9153
    }
    eks.amazonaws.example:53 {
        errors
        forward . 10.0.0.2
        cache 30
    }

---
# Source: tsdns/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: tsdns
  labels:
    app.kubernetes.io/name: tsdns
spec:
  type: ClusterIP
  # Pinned: the tailnet's split-DNS entry names this address out-of-band.
  clusterIP: 172.20.0.53
  selector:
    app.kubernetes.io/name: tsdns
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP

---
# Source: tsdns/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsdns
  labels:
    app.kubernetes.io/name: tsdns
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tsdns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tsdns
      annotations:
        checksum/corefile: 2c38dd0d3b5553c9fc12e94b58fa53f75ada464e3ac7ee57a727c7db3b867e31
        example.com/checksum: abc
    spec:
      priorityClassName: system-cluster-critical
      topologySpreadConstraints: 
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: tsdns
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
      nodeSelector: 
        kubernetes.io/arch: arm64
      tolerations: 
        - effect: NoSchedule
          key: arch
          operator: Equal
          value: arm64
      containers:
        - name: coredns
          image: "mirror.example/registry-k8s-io/coredns/coredns:v1.12.1"
          imagePullPolicy: IfNotPresent
          args: ["-conf", "/etc/coredns/Corefile"]
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: metrics
              containerPort: 9153
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8181
          resources: 
            limits:
              memory: 128Mi
            requests:
              cpu: 20m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: corefile
              mountPath: /etc/coredns
              readOnly: true
      volumes:
        - name: corefile
          configMap:
            name: tsdns
