---
# Source: tailscaled/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscaled
  namespace: tailscale-router
  labels:
    app.kubernetes.io/name: tailscaled

---
# Source: tailscaled/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscaled
  namespace: tailscale-router
  labels:
    app.kubernetes.io/name: tailscaled
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tailscaled
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tailscaled
    spec:
      serviceAccountName: tailscaled
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tailscaled
          image: "tailscale/tailscale:stable"
          imagePullPolicy: IfNotPresent
          env:
            - name: TS_USERSPACE
              value: "true"
            - name: TS_AUTH_KEY
              value: "file:/secrets/auth-key"
            - name: TS_EXTRA_ARGS
              value: "--advertise-routes=10.0.0.0/16,172.20.0.0/16 --accept-dns=false --hostname=k8s-example-router"
            - name: TS_STATE_DIR
              value: /tmp/tailscale-state
            # Empty on purpose: no Secret write-back, so the pod needs no
            # RBAC and every replica is a fresh, ephemeral node.
            - name: TS_KUBE_SECRET
              value: ""
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources: 
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: auth-key
              mountPath: /secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run
      volumes:
        - name: auth-key
          secret:
            secretName: tailscaled-auth-key
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
