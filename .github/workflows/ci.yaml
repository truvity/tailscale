# Calls the shared workflow (truvity/ci-workflows), which runs each
# Justfile recipe as its OWN parallel job, reported under its own name.
#
# Pinned by COMMIT SHA, never a tag — tags move, and this code runs in
# every repository of both organizations.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipes:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@91c763810588ea21a5f7d34d623633230d8baff9 # v3.15.0
    with:
      # Report-only: the component contract (C1-C12) is judged and
      # shown in the job summary, and never fails this job.
      policy-conformance: true
      recipes: '["build", "lint", "test", "leak-canary"]'

  # Stable name for branch protection: the matrix reports as
  # "recipes / lint" and so on, so a required context called "check"
  # would never arrive and every PR would hang waiting for it.
  check:
    needs: recipes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.recipes.result }}" = "success" ]'
