name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@d2ee68415ccb1523a21504598dcce0e0c1e39c68 # v3.12.1
    with:
      recipes: '["vuln"]'
