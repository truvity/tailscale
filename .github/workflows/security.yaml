name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@7d430d514a50982a5c19b9dd0af8c91fe7000589 # v3.26.0
    with:
      recipes: '["vuln"]'
