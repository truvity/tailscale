name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@1ad087e4d51842349d58c3db41a7e17db3459470 # v3.7.1
    with:
      recipes: '["vuln"]'
