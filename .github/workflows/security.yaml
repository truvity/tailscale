name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@88fcad83e4140728da1019fe737fbe88e58b7ea6 # v3.9.0
    with:
      recipes: '["vuln"]'
