name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@a4784bc59078d44bd746f7eb8a49b4d8a03e66c5 # v3.1.0
    with:
      recipes: '["vuln"]'
