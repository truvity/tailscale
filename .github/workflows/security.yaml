name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@eb317bdb3240d43404665cc943d1c00e8946f733 # v2.18.0
    with:
      recipes: '["vuln"]'
