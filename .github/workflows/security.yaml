name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@7145839d72dc8cac8b4557ff69ae8ccd539c0586 # v2.24.1
    with:
      recipes: '["vuln"]'
