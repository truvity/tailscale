name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@a8309f9a4de4cb58306ec4384d31ec6985007f7b # v3.1.2
    with:
      recipes: '["vuln"]'
