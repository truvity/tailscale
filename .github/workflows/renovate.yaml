# Self-hosted Renovate, daily — the shared implementation.
#
# The App identity is carried by the CREDENTIAL NAMES, not by the
# workflow: it reads vars.RENOVATE_CLIENT_ID and
# secrets.RENOVATE_APP_PRIVATE_KEY, org-level on the public estate. The
# shared workflow skips cleanly while the variable is unset.
#
# `secrets: inherit` is mandatory — a called workflow receives none of
# the caller's secrets otherwise.
name: Renovate

on:
  schedule:
    - cron: "0 0 * * *" # daily midnight UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    uses: truvity/ci-workflows/.github/workflows/renovate.yaml@24c5e10642b91e6e4922801d2f3727658171de56 # v2.10.7
    secrets: inherit
