apiVersion: v1
kind: ConfigMap
metadata:
  name: tsdns
  labels:
    app.kubernetes.io/name: tsdns
data:
  Corefile: |
    {{ required "suffix is required" .Values.suffix }}:53 {
        errors
    {{- if .Values.debugLog }}
        # Tagged with the block name: CoreDNS picks a server block by
        # longest-zone match, and "which block answered" is exactly what
        # you cannot tell from an NXDOMAIN. A suffix query showing up
        # under catchall means routing, not the rewrite, is the problem.
        log . "suffix-block {remote} {type} {name} -> {rcode} {>rflags} {duration}"
    {{- end }}
        health :8080
        ready :8181
        rewrite name suffix .svc.{{ .Values.suffix }}. .svc.{{ .Values.clusterDomain }}. answer auto
        forward . {{ required "resolverIP is required" .Values.resolverIP }}
        cache 30
        prometheus :9153
    }
    {{- range .Values.forwardZones }}
    {{ .zone }}:53 {
        errors
    {{- if $.Values.debugLog }}
        log . "forwardzone-block {remote} {type} {name} -> {rcode} {>rflags} {duration}"
    {{- end }}
        forward . {{ .resolver }}
        cache 30
    }
    {{- end }}
    {{- if .Values.catchAll }}
    .:53 {
        errors
    {{- if .Values.debugLog }}
        log . "catchall-block {remote} {type} {name} -> {rcode} {>rflags} {duration}"
    {{- end }}
        forward . {{ .Values.resolverIP }}
        cache 30
    }
    {{- end }}
