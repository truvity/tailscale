apiVersion: v1
kind: Service
metadata:
  name: tsdns
  labels:
    app.kubernetes.io/name: tsdns
spec:
  type: ClusterIP
  # Pinned: the tailnet's split-DNS entry names this address out-of-band.
  clusterIP: {{ required "clusterIP is required" .Values.clusterIP }}
  selector:
    app.kubernetes.io/name: tsdns
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
