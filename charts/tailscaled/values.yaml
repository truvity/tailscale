# tailscaled — a subnet router that makes cluster CIDRs reachable over a
# tailnet. Userspace networking (no NET_ADMIN, no /dev/net/tun), so it
# runs as an ordinary non-root Deployment on any CNI.
#
# Scope: Deployment + ServiceAccount. The auth key Secret, the tailnet ACL
# (tag owners, auto-approvers for the advertised routes) and any
# NetworkPolicy are the estate's — see the README for the split.

replicaCount: 2

image:
  repository: tailscale/tailscale
  tag: "stable"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: tailscaled
  annotations: {}

# Comma-separated CIDRs to advertise (--advertise-routes). Typically the
# cluster's Service CIDR, plus the node/VPC CIDR if you want nodes too.
advertiseRoutes: ""
# Tailnet hostname of this router (--hostname). Make it say which cluster.
hostname: ""
# Extra tailscale flags appended to TS_EXTRA_ARGS.
extraArgs: ""

# Secret holding the auth key (a reusable, pre-authorized, TAGGED key —
# an ephemeral one is reasonable for replicas > 1).
secretName: tailscaled-auth-key
secretKey: auth-key

podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# Userspace networking means netstack buffers EVERY proxied connection in
# the Go heap, so memory tracks concurrent connections, not anything
# static. Idle sits around 20-45Mi; the old 128Mi ceiling left no room
# for a burst, and a router in front of churning backends (pods moving,
# the client re-dialling each one) OOMKilled repeatedly at 128Mi while
# reporting 44Mi steady-state -- observed on truvity devel, 16 restarts
# in 4h. There is deliberately no cpu limit: throttling a router adds
# latency to every packet instead of shedding one pod.
resources:
  requests:
    cpu: 10m
    memory: 128Mi
  limits:
    memory: 512Mi
