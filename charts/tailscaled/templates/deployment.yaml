apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscaled
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: tailscaled
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: tailscaled
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tailscaled
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: tailscaled
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: TS_USERSPACE
              value: "true"
            - name: TS_AUTH_KEY
              value: "file:/secrets/{{ .Values.secretKey }}"
            - name: TS_EXTRA_ARGS
              value: "--advertise-routes={{ .Values.advertiseRoutes }} --accept-dns=false --hostname={{ .Values.hostname }}{{ with .Values.extraArgs }} {{ . }}{{ end }}"
            - name: TS_STATE_DIR
              value: /tmp/tailscale-state
            # Empty on purpose: no Secret write-back, so the pod needs no
            # RBAC and every replica is a fresh, ephemeral node.
            - name: TS_KUBE_SECRET
              value: ""
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: auth-key
              mountPath: /secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run
      volumes:
        - name: auth-key
          secret:
            secretName: {{ .Values.secretName }}
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
