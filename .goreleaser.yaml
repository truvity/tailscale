# Tag-triggered release through truvity/ci-workflows release-public.yaml,
# which runs goreleaser and then pushes every chart under charts/ to
# ghcr.io/truvity/charts at the tag's version.
#
# No binaries: this repository ships Helm charts (and a Go library, which
# needs no build step) — goreleaser's job here is the GitHub Release with
# the changelog, nothing else. `skip: true` is its documented shape for
# library projects.
version: 2

builds:
  - skip: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore"
      - "^ci"
      - "^docs"
      - "^test"

release:
  github: {}
  # pkg/awsrouter's bootstrap user data downloads this exact file by URL
  # and pins its sha256 (bootstrap.go's go:embed of the same path
  # computes that digest, so the two are always the same git blob at
  # this tag — see router-setup.sh's own header comment).
  extra_files:
    - glob: ./pkg/awsrouter/router-setup.sh
      name_template: "router-setup-v{{ .Version }}.sh"
    # pkg/hostaccess's hostaccess-setup.sh, the same way: a host's user data
    # downloads it by URL and pins the sha256 pkg/hostaccess computes from
    # its go:embed of the same file.
    - glob: ./pkg/hostaccess/hostaccess-setup.sh
      name_template: "hostaccess-setup-v{{ .Version }}.sh"
